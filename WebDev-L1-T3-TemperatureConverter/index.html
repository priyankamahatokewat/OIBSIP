<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temperature Converter</title>
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--text:#1b2233;--muted:#6b7488;--border:#d5dbe8;
  --accent:#3b6df0;--ok:#1f9d63;--err:#d93b3b;--errbg:#fdecec;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10141f;--card:#192033;--text:#e8ecf6;--muted:#97a1b8;--border:#2c3550;--accent:#6e93ff;--ok:#41c98a;--err:#ff7070;--errbg:#3a1f26}
}
:root[data-theme="dark"]{--bg:#10141f;--card:#192033;--text:#e8ecf6;--muted:#97a1b8;--border:#2c3550;--accent:#6e93ff;--ok:#41c98a;--err:#ff7070;--errbg:#3a1f26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0 0 4px;font-size:1.5rem}
.sub{margin:0 0 20px;color:var(--muted);font-size:.9rem}
.field{margin-bottom:16px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px}
input{flex:1;width:100%;font-size:1.15rem;padding:12px 14px;border:2px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
input:focus{border-color:var(--accent)}
input.invalid{border-color:var(--err);background:var(--errbg)}
input.valid{border-color:var(--ok)}
.unit{min-width:2.2rem;font-weight:700;color:var(--muted)}
.msg{min-height:1.2em;margin-top:5px;font-size:.82rem;color:var(--err)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
button{font:inherit;font-size:.85rem;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.reset{width:100%;border-radius:10px;padding:11px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.reset:hover{color:#fff;opacity:.9}
.formula{margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--bg);color:var(--muted);font-size:.82rem;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>🌡️ Temperature Converter</h1>
  <p class="sub">Type in any box — the others update instantly.</p>

  <div class="field">
    <label for="c">Celsius</label>
    <div class="row"><input id="c" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><span class="unit">°C</span></div>
    <div class="msg" id="c-msg"></div>
  </div>
  <div class="field">
    <label for="f">Fahrenheit</label>
    <div class="row"><input id="f" inputmode="decimal" autocomplete="off" placeholder="e.g. 77"><span class="unit">°F</span></div>
    <div class="msg" id="f-msg"></div>
  </div>
  <div class="field">
    <label for="k">Kelvin</label>
    <div class="row"><input id="k" inputmode="decimal" autocomplete="off" placeholder="e.g. 298.15"><span class="unit">K</span></div>
    <div class="msg" id="k-msg"></div>
  </div>

  <div class="quick" aria-label="Quick values">
    <button type="button" data-c="-273.15">Absolute zero</button>
    <button type="button" data-c="0">Freezing</button>
    <button type="button" data-c="37">Body</button>
    <button type="button" data-c="100">Boiling</button>
  </div>

  <button type="button" class="reset" id="reset">Clear all</button>

  <div class="formula">
    °F = °C × 9/5 + 32<br>
    K = °C + 273.15<br>
    Lowest allowed: −273.15 °C / −459.67 °F / 0 K
  </div>
</main>

<script>
(function(){
  var ABS_ZERO = -273.15;
  var units = {
    c:{toC:function(v){return v;}, fromC:function(c){return c;}, name:"Celsius"},
    f:{toC:function(v){return (v-32)*5/9;}, fromC:function(c){return c*9/5+32;}, name:"Fahrenheit"},
    k:{toC:function(v){return v-273.15;}, fromC:function(c){return c+273.15;}, name:"Kelvin"}
  };
  var keys = ["c","f","k"];
  var NUM = /^[-+]?(\d+\.?\d*|\.\d+)$/;
  var el = {}, msg = {};
  keys.forEach(function(k){ el[k]=document.getElementById(k); msg[k]=document.getElementById(k+"-msg"); });

  function fmt(x){
    var n = Number(x.toFixed(2));
    if (Object.is(n,-0)) n = 0;
    return String(n);
  }
  function setState(k, state, text){
    el[k].classList.remove("valid","invalid");
    if (state) el[k].classList.add(state);
    msg[k].textContent = text || "";
  }
  function clearOthers(src){
    keys.forEach(function(k){ if(k!==src){ el[k].value=""; setState(k,null,""); } });
  }

  function handle(src){
    var raw = el[src].value.trim();
    if (raw === ""){ clearOthers(src); setState(src,null,""); return; }
    if (/^[-+]?\.?$/.test(raw)){ clearOthers(src); setState(src,null,""); return; } // still typing
    if (!NUM.test(raw)){
      clearOthers(src);
      setState(src,"invalid","Please enter a valid number (digits only, e.g. -12.5).");
      return;
    }
    var n = parseFloat(raw);
    var c = units[src].toC(n);
    if (c < ABS_ZERO - 1e-9){
      clearOthers(src);
      setState(src,"invalid","That is below absolute zero, which is physically impossible.");
      return;
    }
    setState(src,"valid","");
    keys.forEach(function(k){
      if (k!==src){
        el[k].value = fmt(units[k].fromC(c));
        setState(k,"valid","");
      }
    });
  }

  keys.forEach(function(k){
    el[k].addEventListener("input", function(){ handle(k); });
  });

  document.querySelectorAll("[data-c]").forEach(function(b){
    b.addEventListener("click", function(){
      el.c.value = b.getAttribute("data-c");
      handle("c");
    });
  });

  document.getElementById("reset").addEventListener("click", function(){
    keys.forEach(function(k){ el[k].value=""; setState(k,null,""); });
    el.c.focus();
  });
})();
</script>
</body>
</html>
